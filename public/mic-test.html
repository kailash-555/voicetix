<!DOCTYPE html><meta charset="utf-8"><title>Mic test</title><body style="font-family:sans-serif;padding:20px;background:#111;color:#eee"><h2>Mic test</h2><button onclick="go()" style="padding:10px 18px;font-size:16px">🎤 Start</button><pre id="o"></pre><script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,o=document.getElementById('o'),p=t=>o.textContent+=t+'\n';
p('SpeechRecognition: '+(SR?'yes':'NO - use Chrome or Edge'));p('Secure context: '+isSecureContext);p('Online: '+navigator.onLine);
function go(){if(!SR)return;const r=new SR();r.lang='en-IN';r.interimResults=true;r.onstart=()=>p('listening... speak now');
r.onresult=e=>{const x=e.results[e.results.length-1];p((x.isFinal?'FINAL: ':'... ')+x[0].transcript)};r.onerror=e=>p('ERROR: '+e.error);r.onend=()=>p('ended');r.start()}
</script></body>
